<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柏原サロン 昭和なつかしクイズ</title>
  <style>
    body {
      margin: 0;
      padding: 20px 16px 40px;
      background-color: #fbf8f1;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header-bar {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
    }
    .salon-name {
      font-size: 20px;
      font-weight: bold;
      color: #5a7260;
      letter-spacing: 1px;
    }
    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #2c3e50;
      margin-top: 4px;
    }
    .genre-nav {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .genre-btn {
      background: #ffffff;
      border: 1.5px solid #d4c8b8;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }
    .genre-btn.active {
      background: #5a7260;
      color: #ffffff;
      border-color: #5a7260;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
      border: 2px solid #eee4d5;
    }
    .badge {
      display: inline-block;
      background-color: #e27d60;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .question-count {
      float: right;
      font-size: 14px;
      color: #7d8a80;
      font-weight: bold;
      margin-top: 6px;
    }
    .question {
      font-size: 22px;
      line-height: 1.5;
      font-weight: bold;
      margin-bottom: 24px;
      color: #2c3e50;
      clear: both;
    }
    .choice-btn {
      display: block;
      width: 100%;
      background: #fdfcf9;
      border: 2px solid #dcd3c7;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      font-size: 19px;
      text-align: left;
      cursor: pointer;
      color: #333;
      transition: all 0.2s;
    }
    .choice-btn:active {
      background: #f0e6d6;
      transform: scale(0.98);
    }
    .result-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background-color: #f7f9f4;
      border-left: 6px solid #85a389;
    }
    .result-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .explanation {
      font-size: 17px;
      line-height: 1.6;
      color: #4a5568;
    }
    .next-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      background: #5a7260;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .share-section {
      max-width: 480px;
      width: 100%;
      margin-top: 28px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px dashed #c8beaf;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .share-title {
      font-size: 16px;
      font-weight: bold;
      color: #5a7260;
      margin-bottom: 8px;
    }
    .share-desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .qr-image {
      width: 140px;
      height: 140px;
      display: block;
      margin: 0 auto;
      border: 3px solid #f0e6d6;
      border-radius: 10px;
      background: #fff;
    }
    .footer-bar {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #7d8a80;
      line-height: 1.6;
    }
    .quiz-controls{max-width:480px;width:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:14px;background:#fff;border:1px solid #e7dccc;border-radius:15px;margin-bottom:15px}
    .quiz-controls label{font-size:15px;font-weight:bold}
    .quiz-controls select,.small-btn{font-size:16px;min-height:44px;border-radius:9px;padding:7px;border:1px solid #a9a89d;background:#fff;color:#333}
    .small-btn{background:#eef2ea;cursor:pointer}
    .control-description,.library-stats{width:100%;margin:0;text-align:center;font-size:14px;line-height:1.5;color:#5b665f}
    #score-counter{width:100%;text-align:center;font-size:17px;color:#36553e}
    .choice-btn:focus-visible,.genre-btn:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #d39048;outline-offset:2px}
    button:disabled{opacity:.7;cursor:default}
    @media(prefers-reduced-motion:reduce){.choice-btn{transition:none}}
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header-bar">
    <div class="salon-name">🌸 柏原サロン 🌸</div>
    <div class="app-title">昭和なつかしクイズ</div>
  </div>

  <!-- ジャンル切り替えボタン -->
  <div class="genre-nav">
    <button class="genre-btn active" data-genre="all">全問おまかせ</button>
    <button class="genre-btn" data-genre="暮らし">暮らし</button>
    <button class="genre-btn" data-genre="音楽">歌謡曲</button>
    <button class="genre-btn" data-genre="テレビ・芸能">芸能・TV</button>
    <button class="genre-btn" data-genre="出来事・スポーツ">出来事</button>
    <button class="genre-btn" data-genre="学校・おやつ">おやつ・遊び</button>
    <button class="genre-btn" data-genre="春日井・中央線">春日井・中央線</button>
    <button class="genre-btn" data-genre="昭和の旅・暮らし">昭和の旅・暮らし</button>
    <button class="genre-btn" data-genre="名古屋の難読地名">名古屋の難読地名</button>
  </div>

  <section class="quiz-controls" aria-label="クイズの遊び方設定">
    <label for="mode-select">遊び方</label>
    <select id="mode-select">
      <option value="standard">🎲 おまかせ</option>
      <option value="relaxed">☕ のんびりモード</option>
      <option value="local">📍 ご当地名人</option>
      <option value="super">🧠 超難問チャレンジ</option>
      <option value="group">👥 みんなで相談</option>
      <option value="daily">📅 本日の10問</option>
      <option value="review">📖 まちがい復習</option>
    </select>
    <label for="round-length">問題数</label>
    <select id="round-length">
      <option value="10">10問</option><option value="20">20問</option><option value="30">30問</option>
    </select>
    <button type="button" id="restart-btn" class="small-btn">最初から</button>
    <p id="mode-description" class="control-description"></p>
    <strong id="score-counter" aria-live="polite">解答 0 / 10問 ・ 正解 0問</strong>
    <div id="library-stats" class="library-stats" aria-live="polite"></div>
  </section>
  <!-- クイズカード -->
  <div class="card">
    <span class="question-count" id="q-counter"></span>
    <div class="badge" id="category">読み込み中...</div>
    <div class="question" id="question">問題を準備しています...</div>
    <div id="choices"></div>
    <div id="round-summary" class="result-box" aria-live="polite"></div>

    <div class="result-box" id="result-box">
      <div class="result-title" id="result-title"></div>
      <div class="explanation" id="explanation"></div>
    </div>

    <button class="next-btn" id="next-btn" >次の問題へ進む 🌸</button>
  </div>

  <section class="share-section"><div class="share-title">⏱️ タイムアタック・公開ランキング</div><p class="share-desc">名前登録なしで誰でも挑戦！ジャンル別・10/20/30問の上位3位を目指しましょう。</p><p><a href="time-attack.html">タイムアタックに挑戦する →</a></p><p><a href="ranking.html" target="_blank" rel="noopener">🏆 ランキングを見る（別窓）</a></p><p class="share-desc">※ランキングサーバーは公開準備中です。設定完了後に記録が共有されます。</p></section>

  <!-- お友だち共有用 QRコード枠 -->
  <div class="share-section">
    <div class="share-title">📱 お友だちにも教える</div>
    <div class="share-desc">サロンのお仲間やご家族のスマートフォンで、<br>このQRコードをカメラで読み取ると遊べます。</div>
    <img class="qr-image" 
         src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://hiro1960486.github.io/salon-quiz/" 
         alt="サロンクイズのQRコード">
  </div>

  <!-- フッター -->
  <div class="footer-bar">
    ※本アプリは個人の趣味による試作・テスト版です。<br>
    企画・作成：田中裕之（柏原サロン）
  </div>

  <!-- クイズデータ読み込み -->
  <script src="data/life.js"></script>
  <script src="data/music.js"></script>
  <script src="data/tv.js"></script>
  <script src="data/history-sports.js"></script>
  <script src="data/school-snacks.js"></script>
  <script src="data/kasugai-rail.js"></script>
  <script src="data/showa-leisure.js"></script>
  <script src="data/nagoya-yomi.js"></script>
  <script src="quiz-data.js"></script>

  <script src="quiz-engine.js" defer></script>

</body>
</html>
