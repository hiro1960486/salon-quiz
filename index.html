<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柏原サロン 昭和なつかしクイズ</title>
  <style>
    body {
      margin: 0;
      padding: 20px 16px 40px;
      background-color: #fbf8f1;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header-bar {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
    }
    .salon-name {
      font-size: 20px;
      font-weight: bold;
      color: #5a7260;
      letter-spacing: 1px;
    }
    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #2c3e50;
      margin-top: 4px;
    }
    .genre-nav {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .genre-btn {
      background: #ffffff;
      border: 1.5px solid #d4c8b8;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }
    .genre-btn.active {
      background: #5a7260;
      color: #ffffff;
      border-color: #5a7260;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
      border: 2px solid #eee4d5;
    }
    .badge {
      display: inline-block;
      background-color: #e27d60;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .question-count {
      float: right;
      font-size: 14px;
      color: #7d8a80;
      font-weight: bold;
      margin-top: 6px;
    }
    .question {
      font-size: 22px;
      line-height: 1.5;
      font-weight: bold;
      margin-bottom: 24px;
      color: #2c3e50;
      clear: both;
    }
    .choice-btn {
      display: block;
      width: 100%;
      background: #fdfcf9;
      border: 2px solid #dcd3c7;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      font-size: 19px;
      text-align: left;
      cursor: pointer;
      color: #333;
      transition: all 0.2s;
    }
    .choice-btn:active {
      background: #f0e6d6;
      transform: scale(0.98);
    }
    .result-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background-color: #f7f9f4;
      border-left: 6px solid #85a389;
    }
    .result-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .explanation {
      font-size: 17px;
      line-height: 1.6;
      color: #4a5568;
    }
    .next-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      background: #5a7260;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .share-section {
      max-width: 480px;
      width: 100%;
      margin-top: 28px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px dashed #c8beaf;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .share-title {
      font-size: 16px;
      font-weight: bold;
      color: #5a7260;
      margin-bottom: 8px;
    }
    .share-desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .qr-image {
      width: 140px;
      height: 140px;
      display: block;
      margin: 0 auto;
      border: 3px solid #f0e6d6;
      border-radius: 10px;
      background: #fff;
    }
    .footer-bar {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #7d8a80;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header-bar">
    <div class="salon-name">🌸 柏原サロン 🌸</div>
    <div class="app-title">昭和なつかしクイズ</div>
  </div>

  <!-- ジャンル切り替えボタン -->
  <div class="genre-nav">
    <button class="genre-btn active" onclick="selectGenre('all')">全問おまかせ</button>
    <button class="genre-btn" onclick="selectGenre('暮らし')">暮らし</button>
    <button class="genre-btn" onclick="selectGenre('音楽')">歌謡曲</button>
    <button class="genre-btn" onclick="selectGenre('テレビ・芸能')">芸能・TV</button>
    <button class="genre-btn" onclick="selectGenre('出来事・スポーツ')">出来事</button>
    <button class="genre-btn" onclick="selectGenre('学校・おやつ')">おやつ・遊び</button>
  </div>

  <div class="round-setting" style="max-width:480px;width:100%;display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px">
    <label for="round-length">チャレンジ問題数</label>
    <select id="round-length" onchange="initQuiz()" style="font-size:18px;padding:8px;border-radius:8px">
      <option value="10">10問</option><option value="20">20問</option><option value="30">30問</option>
    </select>
    <strong id="score-counter" aria-live="polite">解答 0 / 10問・正解 0問</strong>
  </div>
  <!-- クイズカード -->
  <div class="card">
    <span class="question-count" id="q-counter"></span>
    <div class="badge" id="category">読み込み中...</div>
    <div class="question" id="question">問題を準備しています...</div>
    <div id="choices"></div>
    <div id="round-summary" class="result-box" aria-live="polite"></div>

    <div class="result-box" id="result-box">
      <div class="result-title" id="result-title"></div>
      <div class="explanation" id="explanation"></div>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ進む 🌸</button>
  </div>

  <!-- お友だち共有用 QRコード枠 -->
  <div class="share-section">
    <div class="share-title">📱 お友だちにも教える</div>
    <div class="share-desc">サロンのお仲間やご家族のスマートフォンで、<br>このQRコードをカメラで読み取ると遊べます。</div>
    <img class="qr-image" 
         src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://hiro1960486.github.io/salon-quiz/" 
         alt="サロンクイズのQRコード">
  </div>

  <!-- フッター -->
  <div class="footer-bar">
    ※本アプリは個人の趣味による試作・テスト版です。<br>
    企画・作成：田中裕之（柏原サロン）
  </div>

  <!-- クイズデータ読み込み -->
  <script src="data/life.js"></script>
  <script src="data/music.js"></script>
  <script src="data/tv.js"></script>
  <script src="data/history-sports.js"></script>
  <script src="data/school-snacks.js"></script>
  <script src="quiz-data.js"></script>

  <script>
    let currentGenre = 'all';
    let quizList = [];
    let currentIndex = 0;
    let correctAnswers = 0;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function selectGenre(genre) {
      currentGenre = genre;
      
      // ボタンの見た目切り替え
      const buttons = document.querySelectorAll('.genre-btn');
      buttons.forEach(btn => {
        if ((genre === 'all' && btn.textContent === '全問おまかせ') || btn.textContent.includes(genre)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      initQuiz();
    }

    // 問題の使用履歴はブラウザー内で保持。全件を使い切ったら新しい順に組み直す。
    const QUEUE_PREFIX = 'salonQuizCycleV2:';
    const recentQuestions = new Set();

    function drawFromCycle(genre, difficulty, count) {
      const pool = allQuizData.filter(q =>
        q.genre === genre && (q.difficulty || 'normal') === difficulty
      );
      if (!pool.length || count <= 0) return [];
      const key = QUEUE_PREFIX + genre + ':' + difficulty;
      const ids = pool.map(q => allQuizData.indexOf(q));
      let pending = [], known = [];
      try {
        const stored = JSON.parse(localStorage.getItem(key));
        if (stored && Array.isArray(stored.pending) && Array.isArray(stored.known)) {
          known = stored.known.filter(id => ids.includes(id));
          pending = stored.pending.filter(id => ids.includes(id));
        }
      } catch (err) { /* ストレージが利用できなくても実行可能 */ }
      // 新しい問題だけを未出題の列へ追加する。
      pending.push(...shuffleArray(ids.filter(id => !known.includes(id))));
      known = [...ids];
      if (!pending.length) pending = shuffleArray(ids);
      const selected = [];
      for (let i = 0; i < count && i < pool.length; i++) {
        if (!pending.length) {
          pending = shuffleArray(ids.filter(id => !selected.includes(id)));
          // 周期の境目でも直前と同じ問題を出しにくくする。
          pending.sort((a, b) => Number(recentQuestions.has(a)) - Number(recentQuestions.has(b)));
        }
        const next = pending.shift();
        selected.push(next);
        recentQuestions.add(next);
      }
      if (recentQuestions.size > 20) {
        // 最近の20問だけを記録（古いものから削除）
        const history = [...recentQuestions].slice(-20);
        recentQuestions.clear();
        history.forEach(id => recentQuestions.add(id));
      }
      try { localStorage.setItem(key, JSON.stringify({ pending, known })); } catch (err) {}
      return selected.map(id => allQuizData[id]);
    }

    // 各回の出題数に合わせて、ジャンルと難易度の割当数を均等化する。
    function initQuiz() {
      const total = Number(document.getElementById('round-length').value);
      // 通常60％・難問30％・超難問10％（従来の難しめ40％を維持）。
      const superCount = Math.round(total * 0.1);
      const hardCount = Math.round(total * 0.3);
      const counts = { normal: total - hardCount - superCount, hard: hardCount, super: superCount };
      const difficulties = shuffleArray(Object.entries(counts).flatMap(([d, n]) => Array(n).fill(d)));
      let selected = [];
      if (currentGenre === 'all') {
        // どの問題数でも5ジャンルから同数ずつ。難易度は毎回割り当て直す。
        const genres = shuffleArray([...new Set(allQuizData.map(q => q.genre))]);
        const genreSlots = shuffleArray(genres.flatMap(g => Array(total / genres.length).fill(g)));
        selected = difficulties.map((difficulty, i) =>
          drawFromCycle(genreSlots[i], difficulty, 1)[0]
        );
      } else {
        selected = difficulties.map(difficulty => drawFromCycle(currentGenre, difficulty, 1)[0]);
      }
      // 問題の順番をランダム化しつつ、超難問が続かないようにする。
      const normal = shuffleArray(selected.filter(q => q.difficulty !== 'hard' && q.difficulty !== 'super'));
      const hard = shuffleArray(selected.filter(q => q.difficulty === 'hard'));
      const extreme = shuffleArray(selected.filter(q => q.difficulty === 'super'));
      const arranged = Array(total);
      extreme.forEach((q, i) => {
        const start = Math.floor(i * total / extreme.length);
        const end = Math.floor((i + 1) * total / extreme.length);
        arranged[start + Math.floor(Math.random() * (end - start))] = q;
      });
      const open = shuffleArray(Array.from({length: total}, (_, i) => i).filter(i => !arranged[i]));
      hard.forEach((q, i) => { arranged[open[i]] = q; });
      let ni = 0;
      for (let i = 0; i < total; i++) {
        if (!arranged[i]) arranged[i] = normal[ni++];
      }
      // 1,2,3番の正解位置を均等配分してからランダム化する。
      const positions = shuffleArray(arranged.map((_, i) => i % 3));
      quizList = arranged.map((q, i) => {
        const correctChoice = q.choices[q.correct];
        const distractors = shuffleArray(q.choices.filter((_, index) => index !== q.correct));
        const choices = [...distractors];
        choices.splice(positions[i], 0, correctChoice);
        return { ...q, choices, correct: positions[i] };
      });
      if (quizList.length !== total) {
        console.error('出題数の不一致:', { requested: total, created: quizList.length });
        document.getElementById('question').textContent = '問題の準備に失敗しました。再読み込みしてください。';
        document.getElementById('q-counter').textContent = '';
        document.getElementById('choices').replaceChildren();
        document.getElementById('next-btn').style.display = 'none';
        return;
      }
      currentIndex = 0;
      correctAnswers = 0;
      const summary = document.getElementById('round-summary');
      summary.style.display = 'none';
      document.getElementById('score-counter').textContent = `解答 0 / ${total}問・正解 0問`;
      loadQuestion();
    }

        function loadQuestion() {
      const q = quizList[currentIndex];
      document.getElementById('q-counter').textContent = `第 ${currentIndex + 1} 問 / 全 ${quizList.length} 問`;
      document.getElementById('category').textContent = q.genre;
      document.getElementById('question').textContent = q.question;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('round-summary').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = '';

      q.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = `${index + 1}. ${choice}`;
        btn.onclick = () => checkAnswer(index);
        choicesContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      const q = quizList[currentIndex];
      const isCorrect = selectedIndex === q.correct;
      if (isCorrect) correctAnswers++;
      document.getElementById('score-counter').textContent = `解答 ${currentIndex + 1} / ${quizList.length}問・正解 ${correctAnswers}問`;
      
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(btn => btn.disabled = true);

      const titleEl = document.getElementById('result-title');
      titleEl.textContent = isCorrect ? "大正解！🎉" : "おしい！🌸";
      titleEl.style.color = isCorrect ? "#e27d60" : "#718096";

      document.getElementById('explanation').innerHTML = 
        `<strong>【正解：${q.choices[q.correct]}】</strong><br><br>${q.talk}`;

      document.getElementById('result-box').style.display = 'block';

      const nextBtn = document.getElementById('next-btn');
      if (currentIndex + 1 < quizList.length) {
        nextBtn.textContent = "次の問題へ進む 🌸";
      } else {
        nextBtn.textContent = '結果を見る 🌸';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= quizList.length) {
        const total = quizList.length;
        const percent = Math.round(correctAnswers / total * 100);
        document.getElementById('q-counter').textContent = `全 ${total} 問 完了`;
        document.getElementById('question').textContent = 'チャレンジ終了！おつかれさまでした 🌸';
        document.getElementById('choices').replaceChildren();
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('round-summary').innerHTML =
          `<div class="result-title">結果発表 🎉</div><div class="explanation">挑戦：${total}問<br>解答済み：${total}問<br>正解：${correctAnswers}問<br>正答率：${percent}%</div>`;
        document.getElementById('round-summary').style.display = 'block';
        document.getElementById('next-btn').textContent = 'もう一度チャレンジ 🔄';
        document.getElementById('next-btn').onclick = () => {
          document.getElementById('next-btn').onclick = nextQuestion;
          initQuiz();
        };
      } else {
        loadQuestion();
      }
    }

    // 起動
    window.onload = () => {
      initQuiz();
    };
  </script>

</body>
</html>
