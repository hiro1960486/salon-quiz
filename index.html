<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柏原サロン 昭和なつかしクイズ</title>
  <style>
    body {
      margin: 0;
      padding: 20px 16px 40px;
      background-color: #fbf8f1;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header-bar {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
    }
    .salon-name {
      font-size: 20px;
      font-weight: bold;
      color: #5a7260;
      letter-spacing: 1px;
    }
    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #2c3e50;
      margin-top: 4px;
    }
    .genre-nav {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .genre-btn {
      background: #ffffff;
      border: 1.5px solid #d4c8b8;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }
    .genre-btn.active {
      background: #5a7260;
      color: #ffffff;
      border-color: #5a7260;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
      border: 2px solid #eee4d5;
    }
    .badge {
      display: inline-block;
      background-color: #e27d60;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .question-count {
      float: right;
      font-size: 14px;
      color: #7d8a80;
      font-weight: bold;
      margin-top: 6px;
    }
    .question {
      font-size: 22px;
      line-height: 1.5;
      font-weight: bold;
      margin-bottom: 24px;
      color: #2c3e50;
      clear: both;
    }
    .choice-btn {
      display: block;
      width: 100%;
      background: #fdfcf9;
      border: 2px solid #dcd3c7;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      font-size: 19px;
      text-align: left;
      cursor: pointer;
      color: #333;
      transition: all 0.2s;
    }
    .choice-btn:active {
      background: #f0e6d6;
      transform: scale(0.98);
    }
    .result-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background-color: #f7f9f4;
      border-left: 6px solid #85a389;
    }
    .result-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .explanation {
      font-size: 17px;
      line-height: 1.6;
      color: #4a5568;
    }
    .next-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      background: #5a7260;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .share-section {
      max-width: 480px;
      width: 100%;
      margin-top: 28px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px dashed #c8beaf;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .share-title {
      font-size: 16px;
      font-weight: bold;
      color: #5a7260;
      margin-bottom: 8px;
    }
    .share-desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .qr-image {
      width: 140px;
      height: 140px;
      display: block;
      margin: 0 auto;
      border: 3px solid #f0e6d6;
      border-radius: 10px;
      background: #fff;
    }
    .footer-bar {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #7d8a80;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header-bar">
    <div class="salon-name">🌸 柏原サロン 🌸</div>
    <div class="app-title">昭和なつかしクイズ</div>
  </div>

  <!-- ジャンル切り替えボタン -->
  <div class="genre-nav">
    <button class="genre-btn active" onclick="selectGenre('all')">全問おまかせ</button>
    <button class="genre-btn" onclick="selectGenre('暮らし')">暮らし</button>
    <button class="genre-btn" onclick="selectGenre('音楽')">歌謡曲</button>
    <button class="genre-btn" onclick="selectGenre('テレビ・芸能')">芸能・TV</button>
    <button class="genre-btn" onclick="selectGenre('出来事・スポーツ')">出来事</button>
    <button class="genre-btn" onclick="selectGenre('学校・おやつ')">おやつ・遊び</button>
  </div>

  <!-- クイズカード -->
  <div class="card">
    <span class="question-count" id="q-counter"></span>
    <div class="badge" id="category">読み込み中...</div>
    <div class="question" id="question">問題を準備しています...</div>
    <div id="choices"></div>

    <div class="result-box" id="result-box">
      <div class="result-title" id="result-title"></div>
      <div class="explanation" id="explanation"></div>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ進む 🌸</button>
  </div>

  <!-- お友だち共有用 QRコード枠 -->
  <div class="share-section">
    <div class="share-title">📱 お友だちにも教える</div>
    <div class="share-desc">サロンのお仲間やご家族のスマートフォンで、<br>このQRコードをカメラで読み取ると遊べます。</div>
    <img class="qr-image" 
         src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://hiro1960486.github.io/salon-quiz/" 
         alt="サロンクイズのQRコード">
  </div>

  <!-- フッター -->
  <div class="footer-bar">
    ※本アプリは個人の趣味による試作・テスト版です。<br>
    企画・作成：田中裕之（柏原サロン）
  </div>

  <!-- クイズデータ読み込み -->
  <script src="quiz-data.js"></script>

  <script>
    let currentGenre = 'all';
    let quizList = [];
    let currentIndex = 0;
    const QUIZ_LIMIT = 10; // 1回あたりの出題数

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function selectGenre(genre) {
      currentGenre = genre;
      
      // ボタンの見た目切り替え
      const buttons = document.querySelectorAll('.genre-btn');
      buttons.forEach(btn => {
        if ((genre === 'all' && btn.textContent === '全問おまかせ') || btn.textContent.includes(genre)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      initQuiz();
    }

    function initQuiz() {
      let filtered = (currentGenre === 'all') 
        ? allQuizData 
        : allQuizData.filter(q => q.genre === currentGenre);

      // シャッフルして最大10問を抽出
      // 各回の正解位置を1〜3番にほぼ均等に割り当てる。
      // 問題データの正解インデックスは0始まりなので、並べ替え後に更新する。
      const selected = shuffleArray(filtered).slice(0, QUIZ_LIMIT);
      const positions = shuffleArray(selected.map((_, i) => i % 3));
      quizList = selected.map((q, i) => {
        const correctChoice = q.choices[q.correct];
        const distractors = shuffleArray(
          q.choices.filter((_, index) => index !== q.correct)
        );
        const choices = [...distractors];
        choices.splice(positions[i], 0, correctChoice);
        return { ...q, choices, correct: positions[i] };
      });
      currentIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const q = quizList[currentIndex];
      document.getElementById('q-counter').textContent = `第 ${currentIndex + 1} 問 / 全 ${quizList.length} 問`;
      document.getElementById('category').textContent = q.genre;
      document.getElementById('question').textContent = q.question;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = '';

      q.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = `${index + 1}. ${choice}`;
        btn.onclick = () => checkAnswer(index);
        choicesContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      const q = quizList[currentIndex];
      const isCorrect = selectedIndex === q.correct;
      
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(btn => btn.disabled = true);

      const titleEl = document.getElementById('result-title');
      titleEl.textContent = isCorrect ? "大正解！🎉" : "おしい！🌸";
      titleEl.style.color = isCorrect ? "#e27d60" : "#718096";

      document.getElementById('explanation').innerHTML = 
        `<strong>【正解：${q.choices[q.correct]}】</strong><br><br>${q.talk}`;

      document.getElementById('result-box').style.display = 'block';

      const nextBtn = document.getElementById('next-btn');
      if (currentIndex + 1 < quizList.length) {
        nextBtn.textContent = "次の問題へ進む 🌸";
      } else {
        nextBtn.textContent = "この回は終了！もう一度遊ぶ（シャッフル）🔄";
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= quizList.length) {
        initQuiz();
      } else {
        loadQuestion();
      }
    }

    // 起動
    window.onload = () => {
      initQuiz();
    };
  </script>

</body>
</html>
