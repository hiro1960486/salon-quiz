<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柏原サロン・タイムアタック</title><style>
body{margin:0;background:#fbf8f1;color:#273e35;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;padding:20px 12px}main{max-width:580px;margin:auto}.panel{background:white;border:2px solid #eadfcf;border-radius:20px;padding:22px;margin:14px 0}h1{font-size:26px}h2{font-size:21px}p{line-height:1.6}select,button{font:inherit;border-radius:12px;padding:12px;min-height:47px}select{background:white;border:1px solid #aaa}button{background:#537860;color:white;border:0;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}label{display:inline-flex;flex-direction:column;margin-right:10px;gap:5px}#answers button{display:block;text-align:left;width:100%;background:#fff;color:#263e34;border:2px solid #b5c5b7;margin:12px 0}#answers button:hover{background:#eaf5ed}#timer{font-size:24px;font-weight:bold}#notice{color:#9c503e;font-weight:bold;white-space:pre-wrap}#result{font-size:20px}a{color:#315d8f}.muted{font-size:14px;color:#68746d}#ranking-table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}button:focus-visible,select:focus-visible{outline:3px solid #e9a94f}
#feedback{font-weight:bold;font-size:22px;margin-top:12px;text-align:center} .feedback-correct{color:#17653b}.feedback-wrong{color:#ad5939} #answers .picked-correct{background:#e4f6e7;border-color:#378557}#answers .picked-wrong{background:#fff1e7;border-color:#bc7959}
.review-item{border-top:1px solid #dfded4;padding:12px 0}.review-item h3{margin:6px 0}.review-item p{margin:7px 0}#reviews{margin-top:16px}label.sound-choice{display:flex;flex-direction:row;align-items:center;margin:12px 0;font-size:16px}label.sound-choice input{width:22px;height:22px}
</style></head><body><main><p><a href="./">← 通常クイズへ戻る</a></p><h1>⏱️ タイムアタック</h1><p>名前の登録なしで、誰でも参加できます。正解数を優先し、同点なら回答時間が短い順に順位を決めます。</p>
<section class="panel" id="config"><h2>チャレンジ設定</h2><label>ジャンル<select id="genre">
<option value="all">全ジャンル</option><option value="暮らし">暮らし</option><option value="音楽">歌謡曲</option><option value="テレビ・芸能">芸能・TV</option><option value="出来事・スポーツ">出来事・スポーツ</option><option value="学校・おやつ">学校・おやつ</option><option value="東海">東海・春日井</option><option value="名古屋の難読地名">名古屋の難読地名</option><option value="春日井・中央線">春日井・中央線</option><option value="昭和の旅・暮らし">昭和の旅・暮らし</option>
</select></label><label>問題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option></select></label><label class="sound-choice"><input id="sound-toggle" type="checkbox" checked> 回答時の効果音を鳴らす</label><p><button id="start">スタート！</button></p><p><button id="view-ranking" type="button">🏆 上位3位を見る（別窓）</button></p><p class="muted">スタート時から最終回答までを計測します。ランキングはジャンル別・問題数別です。名前や会員登録は不要です。</p></section>
<section class="panel" id="play" hidden><div id="timer" aria-live="off">00:00.0</div><div id="progress"></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" role="status" aria-live="polite" hidden></div></section>
<section class="panel" id="finish" hidden><h2>結果発表 🌸</h2><p id="result"></p><p id="placing"></p><details open><summary>答え合わせ（全問題）</summary><div id="reviews"></div></details><button id="again">もう一度遊ぶ</button><p><button id="finish-ranking">🏆 ランキングを見る（別窓）</button></p></section>
<p id="notice" role="status"></p><p class="muted">※公開ランキングでは、サーバーが採点・時間を検証して記録します。インターネット接続が必要です。</p></main>
<script src="ranking-config.js?v=20261013-1"></script><script src="time-attack.js?v=20261013-feedback1" defer></script></body></html>
